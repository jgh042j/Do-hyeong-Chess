<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>도형체스</title>
<meta name="description" content="원, 선, 세모, 네모, 오각형, 육각형 카드로 겨루는 2인용 카드 대결. 도형체스.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#14121C; --panel:#1D1A28; --panel-2:#242032; --line:#332E45;
    --ink:#F2EFE9; --muted:#8A8496;
    --yellow:#F0B429; --white:#EDE6D6;
    --teal:#3FA796; --teal-ink:#06201B;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #221D33 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px;margin:0 auto;padding:40px 18px 60px;text-align:center;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.22em;color:var(--muted);
  }
  h1{
    font-family:'Fraunces',serif;font-weight:700;font-optical-sizing:auto;
    font-size:clamp(32px,8vw,44px);line-height:1.05;margin:10px 0 6px;
    letter-spacing:-.01em;
  }
  .sub{color:var(--muted);font-size:14px;margin:0 0 30px;line-height:1.5;}
  .dots{display:flex;justify-content:center;gap:10px;margin:18px 0 30px;}
  .dot{width:26px;height:26px;border-radius:50%;}
  .dot.yellow{background:var(--yellow);}
  .dot.white{background:var(--white);}

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:15px;
    border-radius:999px;border:none;cursor:pointer;padding:16px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    width:100%;text-align:left;transition:transform .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-block{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto;}
  .mode-btn{background:var(--panel);border:2px solid var(--line);color:var(--ink);flex-direction:column;align-items:flex-start;}
  .mode-btn .name{font-weight:700;font-size:16px;}
  .mode-btn .desc{font-size:12px;color:var(--muted);font-weight:400;}
  .mode-btn.primary{border-color:var(--teal);}

  .level-btn{background:var(--panel);border:2px solid var(--line);color:var(--ink);flex-direction:row;align-items:center;}
  .level-btn .lname{font-weight:700;font-size:16px;}
  .level-btn .ldesc{font-size:11px;color:var(--muted);}
  .level-btn .arrow{color:var(--teal);font-size:18px;}

  .back-btn{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;margin-bottom:18px;padding:8px;}
  .footer-note{text-align:center;color:var(--muted);font-size:11px;margin-top:36px;line-height:1.6;}
  .fadein{animation:fadein .35s ease both;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
let step = 'mode'; // 'mode' | 'level'
let chosenMode = null; // '2p' | 'ai'

function chooseMode(m){
  chosenMode = m;
  step = 'level';
  render();
}
function goLevel(file){
  location.href = file + '?mode=' + chosenMode;
}
function goBack(){
  step = 'mode';
  chosenMode = null;
  render();
}

function render(){
  const el = document.getElementById('app');
  if(step === 'mode'){
    el.innerHTML = `
      <div class="fadein">
        <div class="eyebrow">DOHYEONG CHESS</div>
        <div class="dots"><div class="dot yellow"></div><div class="dot white"></div></div>
        <h1>도형체스</h1>
        <p class="sub">선수(先手)를 정하는 카드 대결. 누구와 대결할까요?</p>
        <div class="btn-block">
          <button class="btn mode-btn primary" onclick="chooseMode('2p')">
            <span class="name">2인용</span>
            <span class="desc">사람 대 사람</span>
          </button>
          <button class="btn mode-btn" onclick="chooseMode('ai')">
            <span class="name">인공지능</span>
            <span class="desc">AI와 대결</span>
          </button>
        </div>
        <p class="footer-note">Made with Claude · 무료로 즐기는 카드 대결</p>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="fadein">
        <button class="back-btn" onclick="goBack()">← 뒤로</button>
        <div class="eyebrow">DOHYEONG CHESS · ${chosenMode==='2p'?'2인용':'인공지능'}</div>
        <h1 style="font-size:28px;">방식 선택</h1>
        <p class="sub">어떤 방식으로 대결할까요?</p>
        <div class="btn-block">
          <button class="btn level-btn" onclick="goLevel('lv0-1.html')">
            <div>
              <div class="lname">LV.0-1</div>
              <div class="ldesc">순서대로 3장 동시 대조</div>
            </div>
            <span class="arrow">→</span>
          </button>
          <button class="btn level-btn" onclick="goLevel('lv0-2.html')">
            <div>
              <div class="lname">LV.0-2</div>
              <div class="ldesc">뒤집힌 카드를 지목해서 대조</div>
            </div>
            <span class="arrow">→</span>
          </button>
          <button class="btn level-btn" onclick="goLevel('lv0-3.html')">
            <div>
              <div class="lname">LV.0-3</div>
              <div class="ldesc">지목 대조 + 이긴 도형은 차감되어 회수</div>
            </div>
            <span class="arrow">→</span>
          </button>
        </div>
        <p class="footer-note">Made with Claude · 무료로 즐기는 카드 대결</p>
      </div>`;
  }
}
render();
</script>
</body>
</html>
