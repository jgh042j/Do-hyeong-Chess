<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>도형 체스 LV.0-1 — 선수(先手) 정하기</title>
<meta name="description" content="원, 선, 세모, 네모, 오각형, 육각형 카드로 겨루는 2인용 카드 대결. 도형 체스 LV.0-1.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#14121C; --panel:#1D1A28; --panel-2:#242032; --line:#332E45;
    --ink:#F2EFE9; --muted:#8A8496;
    --yellow:#F0B429; --yellow-ink:#241D08;
    --white:#EDE6D6; --white-ink:#241D08;
    --teal:#3FA796; --teal-ink:#06201B;
    --danger:#D65A5A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #221D33 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:24px 18px 60px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.22em;color:var(--muted);
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .eyebrow .icons{display:flex;gap:14px;}
  .eyebrow button{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;opacity:.75;transition:opacity .15s;}
  .eyebrow button:hover{opacity:1;}
  .eyebrow svg{display:block;}

  h1{
    font-family:'Fraunces',serif;font-weight:700;font-optical-sizing:auto;
    font-size:clamp(30px,7vw,42px);line-height:1.05;margin:6px 0 2px;
    letter-spacing:-.01em;
  }
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px;max-width:38ch;line-height:1.5;}

  .card-panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;
  }

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:15px;
    border-radius:999px;border:none;cursor:pointer;padding:14px 22px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--teal);color:var(--teal-ink);}
  .btn-primary:hover{box-shadow:0 6px 20px -6px rgba(63,167,150,.55);}
  .btn-ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}

  .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
  .team-card{
    border-radius:var(--radius);padding:20px 14px;text-align:center;cursor:pointer;
    border:2px solid var(--line);background:var(--panel);
    transition:transform .15s, border-color .15s;
  }
  .team-card:hover{transform:translateY(-3px);}
  .team-card.yellow{border-color:color-mix(in srgb, var(--yellow) 55%, var(--line));}
  .team-card.white{border-color:color-mix(in srgb, var(--white) 55%, var(--line));}
  .dot{width:34px;height:34px;border-radius:50%;margin:0 auto 10px;}
  .dot.yellow{background:var(--yellow);}
  .dot.white{background:var(--white);}
  .team-card .name{font-weight:700;font-size:15px;}

  .scoreboard{
    display:flex;justify-content:center;gap:34px;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:10px 22px;margin-bottom:16px;
  }
  .scoreboard .s{text-align:center;}
  .scoreboard .s .lbl{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center;}
  .scoreboard .s .val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;}
  .swatch{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .cards-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:16px 0;}
  .card{
    width:96px;height:132px;border-radius:12px;background:var(--panel-2);
    border:2px solid var(--line);display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;padding:10px 6px;cursor:pointer;
    position:relative;transition:transform .15s, border-color .15s, background .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .card.selected{transform:translateY(-6px);}
  .card.disabled{opacity:.32;cursor:default;}
  .card .order{
    position:absolute;top:-9px;right:-9px;min-width:26px;height:22px;padding:0 4px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
    border:2px solid var(--bg);
  }
  .card .name{font-weight:700;font-size:13px;}
  .card .meta{font-size:10px;color:var(--muted);}
  .card svg{display:block;}

  .center-note{text-align:center;color:var(--muted);font-size:13px;margin:10px 0;}
  .vs-row{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0;}
  .mini-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:10px;background:var(--panel-2);width:78px;}
  .mini-card .name{font-size:11px;font-weight:700;}
  .result-desc{text-align:center;font-size:13px;color:var(--ink);line-height:1.6;padding:0 8px;}

  .history-item{background:var(--panel-2);border-radius:10px;padding:10px;margin-bottom:8px;}
  .history-item .round{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:6px;}

  .modal-bg{
    position:fixed;inset:0;background:rgba(10,9,15,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    max-width:440px;width:100%;max-height:86vh;overflow-y:auto;padding:0;
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-family:'Fraunces',serif;font-size:19px;font-weight:700;}
  .modal-close{background:none;border:none;color:var(--muted);cursor:pointer;}
  .modal-body{padding:18px;}

  /* tutorial */
  .tut-stage{
    background:var(--panel-2);border-radius:12px;height:220px;
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
    margin-bottom:14px;
  }
  .tut-caption{font-size:14px;line-height:1.6;color:var(--ink);min-height:64px;}
  .tut-controls{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .tut-progress{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden;}
  .tut-progress-fill{height:100%;background:var(--teal);width:0%;transition:width .1s linear;}
  .tut-playbtn{
    width:38px;height:38px;border-radius:50%;background:var(--teal);color:var(--teal-ink);
    border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .tut-step-dots{display:flex;gap:6px;justify-content:center;margin-top:12px;}
  .tut-step-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);}
  .tut-step-dots span.active{background:var(--teal);}

  .fadein{animation:fadein .35s ease both;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block;animation:aidotpulse 1s ease-in-out infinite;}
  @keyframes aidotpulse{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}

  .footer-note{text-align:center;color:var(--muted);font-size:11px;margin-top:26px;line-height:1.6;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================== DATA ============================== */
const SHAPES = [
  { id:'circle',   name:'원',     num:'1-1',  score:1, grade:6 },
  { id:'line',     name:'선',     num:'2-5',  score:2, grade:5 },
  { id:'triangle', name:'세모',   num:'3-9',  score:3, grade:4 },
  { id:'square',   name:'네모',   num:'4-13', score:4, grade:3 },
  { id:'pentagon', name:'오각형', num:'5-17', score:5, grade:2 },
  { id:'hexagon',  name:'육각형', num:'6-20', score:6, grade:1 },
];
const SPECIALS = [
  { id:'myeol1', name:'멸①', num:'M-1', desc:'상대 도형 0점 만들기', special:true },
  { id:'myeol2', name:'멸②', num:'M-2', desc:'상대 도형 획득하기',   special:true },
];
const TEAM = {
  yellow:{ label:'노란 팀', accent:'var(--yellow)', ink:'var(--yellow-ink)' },
  white:{ label:'흰 팀', accent:'var(--white)', ink:'var(--white-ink)' },
};
function makeHand(team){
  return [...SHAPES, ...SPECIALS].map(c=>({...c, team, uid:team+'-'+c.id}));
}

/* ============================== SOUND ============================== */
let audioCtx=null, muted=false;
function ctx(){ if(!audioCtx){ const C=window.AudioContext||window.webkitAudioContext; if(C) audioCtx=new C(); } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function tone(freq,dur,type,vol,delay){
  if(muted) return; const c=ctx(); if(!c) return;
  const osc=c.createOscillator(), gain=c.createGain();
  osc.type=type||'sine'; osc.frequency.value=freq;
  osc.connect(gain); gain.connect(c.destination);
  const t0=c.currentTime+(delay||0);
  gain.gain.setValueAtTime(.0001,t0);
  gain.gain.exponentialRampToValueAtTime(vol||.12,t0+.01);
  gain.gain.exponentialRampToValueAtTime(.0001,t0+(dur||.1));
  osc.start(t0); osc.stop(t0+(dur||.1)+.02);
}
const sfx = {
  click:()=>tone(320,.05,'square',.08),
  select:()=>tone(880,.06,'sine',.12),
  deselect:()=>tone(440,.05,'sine',.08),
  confirm:()=>{tone(520,.05,'square',.1); tone(760,.08,'square',.09,.05);},
  capture:()=>{tone(660,.09,'triangle',.16); tone(920,.13,'triangle',.16,.08);},
  destroy:()=>tone(160,.18,'sawtooth',.12),
  special:()=>{tone(1300,.05,'square',.13); tone(260,.18,'sawtooth',.1,.05);},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.15,i*.12)),
  draw:()=>{tone(240,.25,'sine',.12); tone(200,.25,'sine',.1,.05);},
};
function playOutcome(list){
  const hasCapture = list.some(r=>r.scoreY>0||r.scoreW>0);
  const hasSpecial = list.some(r=>r.yc.special||r.wc.special);
  if(hasCapture) sfx.capture(); else if(hasSpecial) sfx.special(); else sfx.destroy();
}

/* ============================== SHAPE ICON ============================== */
function shapeSVG(id,color,size){
  size=size||48;
  const s=100, common=`fill="none" stroke="${color}" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"`;
  let inner='';
  if(id==='circle') inner=`<circle cx="50" cy="50" r="34" ${common}/>`;
  else if(id==='line') inner=`<line x1="16" y1="50" x2="84" y2="50" ${common} stroke-width="12"/>`;
  else if(id==='triangle') inner=`<polygon points="50,14 88,82 12,82" ${common}/>`;
  else if(id==='square') inner=`<rect x="16" y="16" width="68" height="68" rx="4" ${common}/>`;
  else if(id==='pentagon') inner=`<polygon points="50,10 90,40 74,88 26,88 10,40" ${common}/>`;
  else if(id==='hexagon') inner=`<polygon points="50,6 88,28 88,72 50,94 12,72 12,28" ${common}/>`;
  else if(id==='myeol1') inner=`<circle cx="50" cy="50" r="34" fill="none" stroke="${color}" stroke-width="9"/><line x1="26" y1="26" x2="74" y2="74" stroke="${color}" stroke-width="9" stroke-linecap="round"/>`;
  else if(id==='myeol2') inner=`<circle cx="50" cy="50" r="34" fill="none" stroke="${color}" stroke-width="9"/><line x1="50" y1="26" x2="50" y2="44" stroke="${color}" stroke-width="9" stroke-linecap="round"/><line x1="50" y1="56" x2="50" y2="74" stroke="${color}" stroke-width="9" stroke-linecap="round"/><line x1="26" y1="50" x2="44" y2="50" stroke="${color}" stroke-width="9" stroke-linecap="round"/><line x1="56" y1="50" x2="74" y2="50" stroke="${color}" stroke-width="9" stroke-linecap="round"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">${inner}</svg>`;
}

/* ============================== GAME LOGIC ============================== */
function judgePair(yc, wc){
  const ySpecial = !!yc.special, wSpecial = !!wc.special;
  let desc, yRemoved=false, wRemoved=false, scoreY=0, scoreW=0, captureY=null, captureW=null;
  if(ySpecial && wSpecial){
    desc = `${yc.name} ↔ ${wc.name} : 특수 카드끼리 충돌 → 두 카드 모두 소멸`;
    yRemoved=true; wRemoved=true;
  } else if(!ySpecial && !wSpecial){
    if(yc.id===wc.id){
      desc = `${yc.name} ↔ ${wc.name} : 같은 도형 충돌 → 0점 처리, 두 카드 모두 소멸`;
      yRemoved=true; wRemoved=true;
    } else if(yc.score>wc.score){
      desc = `${yc.name}(${yc.score}점) 이 ${wc.name}(${wc.score}점) 제압 → 노란 팀 +${wc.score}점, ${yc.name} 카드는 회수(재사용 가능)`;
      wRemoved=true; scoreY=wc.score; captureY=wc;
    } else {
      desc = `${wc.name}(${wc.score}점) 이 ${yc.name}(${yc.score}점) 제압 → 흰 팀 +${yc.score}점, ${wc.name} 카드는 회수(재사용 가능)`;
      yRemoved=true; scoreW=yc.score; captureW=yc;
    }
  } else {
    const specialIsY = ySpecial;
    const special = specialIsY?yc:wc, shape = specialIsY?wc:yc;
    if(special.id==='myeol1'){
      desc = `${special.name}(상대 도형 0점 만들기) 발동 → ${shape.name} 무력화되어 소멸, ${special.name}도 함께 소멸`;
      yRemoved=true; wRemoved=true;
    } else {
      const gainer = specialIsY?'노란 팀':'흰 팀';
      desc = `${special.name}(상대 도형 획득하기) 발동 → ${gainer} +${shape.score}점 획득, ${shape.name} 소멸, ${special.name}도 함께 소멸`;
      yRemoved=true; wRemoved=true;
      if(specialIsY){scoreY=shape.score; captureY=shape;} else {scoreW=shape.score; captureW=shape;}
    }
  }
  return {desc,yRemoved,wRemoved,scoreY,scoreW,captureY,captureW};
}

/* ============================== APP STATE ============================== */
let state = {
  phase:'modeSelect', // modeSelect | intro | pass | select | reveal | gameover
  vsAI:false, aiTeam:null,
  firstTeam:null, turnTeam:null,
  hands:{yellow:[], white:[]},
  score:{yellow:0, white:0},
  selY:[], selW:[],
  results:[], history:[], captured:{yellow:[],white:[]},
  showInfo:false, muted:false,
};

function setState(patch){ state = {...state, ...patch}; render(); }

function chooseMode(vsAI){
  sfx.confirm();
  setState({vsAI, phase:'intro'});
}

function aiChooseCards(hand, count){
  const shapes = hand.filter(c=>!c.special).sort((a,b)=>b.score-a.score);
  const specials = hand.filter(c=>c.special);
  const picks=[];
  // include a special when we randomly want to, OR when shapes alone can't reach `count` and a special is available
  const needSpecial = shapes.length < count;
  if(specials.length && (needSpecial || Math.random()<0.5)) picks.push(specials[Math.floor(Math.random()*specials.length)]);
  while(picks.length<count && shapes.length) picks.push(shapes.shift());
  // still short (e.g. random check skipped the special but it was actually needed) — top up with one more special if allowed
  if(picks.length<count && specials.length && !picks.some(c=>c.special)){
    picks.push(specials[Math.floor(Math.random()*specials.length)]);
  }
  return picks.slice(0,count);
}

function maybeTriggerAI(){
  if(!state.vsAI || state.phase!=='pass' || state.turnTeam!==state.aiTeam) return;
  setTimeout(()=>{
    if(state.phase!=='pass' || state.turnTeam!==state.aiTeam) return;
    const n = selectCount();
    const picks = aiChooseCards(state.hands[state.aiTeam], n);
    const key = state.aiTeam==='yellow'?'selY':'selW';
    setState({[key]:picks});
    setTimeout(()=>{
      if(state.phase!=='pass' || state.turnTeam!==state.aiTeam) return;
      confirmSelection();
    }, 500);
  }, 700);
}

function startGame(team){
  sfx.confirm();
  const aiTeam = state.vsAI ? (team==='yellow'?'white':'yellow') : null;
  setState({
    phase:'pass', firstTeam:team, turnTeam:team, aiTeam,
    hands:{yellow:makeHand('yellow'), white:makeHand('white')},
    score:{yellow:0,white:0}, selY:[], selW:[], results:[], history:[],
    captured:{yellow:[],white:[]},
  });
}

function maxSelectable(hand){
  const shapes = hand.filter(c=>!c.special).length;
  const specials = hand.filter(c=>c.special).length;
  return shapes + Math.min(1, specials);
}
function selectCount(){ return Math.min(3, maxSelectable(state.hands.yellow), maxSelectable(state.hands.white)); }

function toggleSelect(team, card){
  const key = team==='yellow'?'selY':'selW';
  const sel = state[key];
  const exists = sel.find(c=>c.uid===card.uid);
  if(exists){ sfx.deselect(); setState({[key]: sel.filter(c=>c.uid!==card.uid)}); return; }
  if(sel.length >= selectCount()) return;
  const specialsSelected = sel.filter(c=>c.special).length;
  if(card.special && specialsSelected>=1) return;
  sfx.select();
  setState({[key]:[...sel, card]});
}

function confirmSelection(){
  if(state.turnTeam===state.firstTeam){
    sfx.confirm();
    const other = state.firstTeam==='yellow'?'white':'yellow';
    setState({turnTeam:other, phase:'pass'});
    maybeTriggerAI();
    return;
  }
  const n = selectCount();
  if(state.selY.length < n || state.selW.length < n){
    console.warn('선택된 카드 수가 부족해 자동으로 다시 골랐어요.', state.selY, state.selW);
    const fillY = state.selY.length < n ? aiChooseCards(state.hands.yellow.filter(c=>!state.selY.includes(c)), n-state.selY.length) : [];
    const fillW = state.selW.length < n ? aiChooseCards(state.hands.white.filter(c=>!state.selW.includes(c)), n-state.selW.length) : [];
    state = {...state, selY:[...state.selY, ...fillY], selW:[...state.selW, ...fillW]};
  }
  let outcomes=[], scoreDelta={yellow:0,white:0}, captures={yellow:[],white:[]};
  let removedY=[], removedW=[];
  for(let i=0;i<n;i++){
    const yc=state.selY[i], wc=state.selW[i];
    const r = judgePair(yc,wc);
    outcomes.push({yc,wc,desc:r.desc, scoreY:r.scoreY, scoreW:r.scoreW});
    if(r.yRemoved) removedY.push(yc.uid);
    if(r.wRemoved) removedW.push(wc.uid);
    scoreDelta.yellow += r.scoreY; scoreDelta.white += r.scoreW;
    if(r.captureY) captures.yellow.push(r.captureY);
    if(r.captureW) captures.white.push(r.captureW);
  }
  playOutcome(outcomes);
  const remainY = state.hands.yellow.filter(c=>!state.selY.find(p=>p.uid===c.uid));
  const remainW = state.hands.white.filter(c=>!state.selW.find(p=>p.uid===c.uid));
  const keepY = state.selY.filter(c=>!removedY.includes(c.uid));
  const keepW = state.selW.filter(c=>!removedW.includes(c.uid));
  setState({
    hands:{yellow:[...remainY,...keepY], white:[...remainW,...keepW]},
    score:{yellow:state.score.yellow+scoreDelta.yellow, white:state.score.white+scoreDelta.white},
    captured:{yellow:[...state.captured.yellow,...captures.yellow], white:[...state.captured.white,...captures.white]},
    history:[...state.history,{round:state.history.length+1, outcomes}],
    results:outcomes, selY:[], selW:[], phase:'reveal',
  });
}

function nextRound(){
  const noCards = state.hands.yellow.length===0 || state.hands.white.length===0;
  const noShapes = (state.hands.yellow.length>0 && state.hands.yellow.every(c=>c.special)) ||
                    (state.hands.white.length>0 && state.hands.white.every(c=>c.special));
  if(noCards || noShapes){
    sfx.click();
    setState({phase:'gameover'});
    setTimeout(()=>{
      const w = winnerInfo();
      if(w.winner) sfx.win(); else sfx.draw();
    }, 50);
    return;
  }
  sfx.click();
  setState({turnTeam:state.firstTeam, phase:'pass'});
}

function winnerInfo(){
  const gradeSum = t => state.captured[t].reduce((a,c)=>a+c.grade,0);
  let winner=null, reason='';
  if(state.score.yellow!==state.score.white){
    winner = state.score.yellow>state.score.white?'yellow':'white'; reason='획득 점수 합';
  } else if(gradeSum('yellow')!==gradeSum('white')){
    winner = gradeSum('yellow')>gradeSum('white')?'yellow':'white'; reason='동점 → 등급 합';
  } else if(state.captured.yellow.length!==state.captured.white.length){
    winner = state.captured.yellow.length>state.captured.white.length?'yellow':'white'; reason='동점·동급 → 획득 개수';
  } else reason='점수·등급·획득 개수 모두 동일';
  return {winner, reason};
}

let tutState = { step:0, playing:true, elapsed:0, raf:null, lastTs:null };

function openTutorial(){
  sfx.click();
  tutState = { step:0, playing:true, elapsed:0, raf:null, lastTs:null };
  setState({showTutorial:true});
  tutTick();
}
function closeTutorial(){ if(tutState.raf) cancelAnimationFrame(tutState.raf); setState({showTutorial:false}); }
function tutTick(ts){
  if(!state.showTutorial) return;
  if(tutState.lastTs==null) tutState.lastTs = ts||performance.now();
  const now = ts||performance.now();
  const dt = now - tutState.lastTs;
  tutState.lastTs = now;
  if(tutState.playing) tutState.elapsed += dt;
  const cur = TUTORIAL_STEPS[tutState.step];
  if(tutState.elapsed >= cur.dur){
    if(tutState.step < TUTORIAL_STEPS.length-1){ tutState.step++; tutState.elapsed=0; renderTutorialBody(); }
    else { tutState.playing=false; }
  }
  updateTutProgress();
  tutState.raf = requestAnimationFrame(tutTick);
}
function updateTutProgress(){
  const cur = TUTORIAL_STEPS[tutState.step];
  const pct = Math.min(100, (tutState.elapsed/cur.dur)*100);
  const fill = document.getElementById('tutFill');
  if(fill) fill.style.width = pct+'%';
  const playBtn = document.getElementById('tutPlayBtn');
  if(playBtn) playBtn.innerHTML = tutState.playing ? iconPause() : iconPlay();
  const dots = document.querySelectorAll('.tut-step-dots span');
  dots.forEach((d,i)=> d.classList.toggle('active', i===tutState.step));
}
function iconPlay(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>`; }
function iconPause(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`; }
function tutToggle(){ tutState.playing = !tutState.playing; updateTutProgress(); }
function tutStep(dir){
  tutState.step = Math.max(0, Math.min(TUTORIAL_STEPS.length-1, tutState.step+dir));
  tutState.elapsed = 0; tutState.playing = true;
  renderTutorialBody();
}
function renderTutorialBody(){
  const body = document.getElementById('tutBody');
  if(!body) return;
  const cur = TUTORIAL_STEPS[tutState.step];
  body.innerHTML = `
    <div class="tut-stage">${cur.stage()}</div>
    <p class="tut-caption">${cur.caption}</p>
    <div class="tut-controls">
      <button class="btn btn-ghost" style="padding:8px 12px" onclick="tutStep(-1)">이전</button>
      <button class="tut-playbtn" id="tutPlayBtn" onclick="tutToggle()">${iconPause()}</button>
      <div class="tut-progress"><div class="tut-progress-fill" id="tutFill"></div></div>
      <button class="btn btn-ghost" style="padding:8px 12px" onclick="tutStep(1)">다음</button>
    </div>
    <div class="tut-step-dots">${TUTORIAL_STEPS.map((_,i)=>`<span class="${i===tutState.step?'active':''}"></span>`).join('')}</div>
  `;
}

          <li>대조는 서로 마주보는 카드끼리 좌에서 우로 오픈된다.</li>
          <li><b>같은 모양끼리 만나면</b> — 둘 다 0점, 두 카드 모두 소멸</li>
          <li><b>다른 모양이 만나면</b> — 점수가 높은 쪽이 상대를 획득(+점수). 이긴 카드는 회수되어 다음 라운드에 다시 쓸 수 있어요</li>
        </ul>

        ${sectionHead('② 특수 카드 (멸)')}
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div style="background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;">
            <div style="flex-shrink:0;margin-top:2px;">${shapeSVG('myeol1','var(--teal)',22)}</div>
            <div><b>멸①</b> — 상대 도형을 무력화만 시켜요. 점수 없이 상대 카드와 멸①이 함께 소멸돼요.</div>
          </div>
          <div style="background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;">
            <div style="flex-shrink:0;margin-top:2px;">${shapeSVG('myeol2','var(--teal)',22)}</div>
            <div><b>멸②</b> — 상대 도형을 점수 그대로 획득해요. 상대 카드와 멸②가 함께 소멸돼요.</div>
          </div>
        </div>
        <ul style="padding-left:18px;margin:10px 0 0;">
          <li>멸끼리 만나면 둘 다 소멸(점수 없음)</li>
          <li>3장을 고를 때 멸은 한 번에 하나만 낼 수 있어요</li>
        </ul>

        ${sectionHead('③ 게임은 언제 끝나나요')}
        <ul style="padding-left:18px;margin:0;">
          <li>어느 한 팀의 카드가 다 떨어지면 종료</li>
          <li>도형 카드 없이 멸 카드만 남아도 더 낼 수 없어서 종료</li>
        </ul>

        ${sectionHead('④ 승패는 이 순서로 가려요')}
        <ol style="padding-left:20px;margin:0;">
          <li>획득 점수 합이 더 높은 팀 승리</li>
          <li>점수가 같으면 → 등급 합이 더 높은 팀 승리</li>
          <li>등급 합도 같으면 → 획득한 카드 개수가 더 많은 팀 승리</li>
          <li>그마저 같으면 → 무승부</li>
        </ol>

        ${sectionHead('도형별 점수 · 등급')}
        <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;">
          <thead><tr style="color:var(--muted);font-size:11px;"><th style="text-align:left;font-weight:400;padding:0 4px 6px;">도형</th><th style="font-weight:400;padding:0 4px 6px;">번호</th><th style="font-weight:400;padding:0 4px 6px;">점수</th><th style="font-weight:400;padding:0 4px 6px;">등급</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <p class="sub" style="margin:0 0 6px;font-size:11px;">등급은 육각형에서 원으로 반대의 순서로 강해집니다 — 육각형이 1등급(최상), 원이 6등급(최하).</p>

        <button class="btn btn-primary btn-block" style="margin-top:18px" onclick="setState({showInfo:false}); openTutorial();">${iconReplay()} 영상으로 보기</button>
      </div>
    </div>
  </div>`;
}

/* ============================== MAIN RENDER ============================== */
function render(){
  const el = document.getElementById('app');
  let body='';
  if(state.phase==='modeSelect') body = screenModeSelect();
  else if(state.phase==='intro') body = screenIntro();
  else if(state.phase==='pass') body = screenPass();
  else if(state.phase==='select') body = screenSelect();
  else if(state.phase==='reveal') body = screenReveal();
  else if(state.phase==='gameover') body = screenGameover();

  el.innerHTML = `
    <div class="eyebrow">
      <span>DOHYEONG CHESS · LV.0-1</span>
      <span class="icons">
        <button onclick="restartToStart()" title="처음으로" style="display:flex;align-items:center;gap:4px;">${iconRestart()}<span style="font-size:10px;">처음부터</span></button>
        <button onclick="openTutorial()" title="게임 방법">${iconInfo()}</button>
        <button onclick="toggleMute()" title="음소거">${iconMute(state.muted)}</button>
      </span>
    </div>
    ${body}
    <p class="footer-note">Made with Claude · 무료로 즐기는 카드 대결</p>
    ${state.showTutorial ? modalTutorial() : ''}
    ${state.showInfo ? modalInfo() : ''}
  `;
  if(state.showTutorial) renderTutorialBody();
}
function iconRestart(){ return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`; }
function restartToStart(){
  sfx.click();
  setState({phase:'modeSelect'});
}
function toggleMute(){
  muted = !muted;
  setState({muted});
  if(!muted) sfx.click();
}

render();
</script>
</body>
</html>
